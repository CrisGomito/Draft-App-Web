<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aplicación Distribuida</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            color: #333;
        }

        h1, h2 {
            color: #2c3e50;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 95%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

            button:hover {
                background-color: #0056b3;
            }

        .btn-danger {
            background-color: #dc3545;
            padding: 5px 10px;
            width: auto;
            font-size: 12px;
        }

            .btn-danger:hover {
                background-color: #c82333;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border: 1px solid #dee2e6;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #343a40;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Administración General de la Tienda</h1>

    <!-- SECCIÓN DE CATEGORÍAS -->
    <div class="grid-container">
        <div class="card">
            <h2>Nueva Categoría</h2>
            <form id="categoriaForm">
                <div class="form-group">
                    <label>Nombre de Categoría:</label>
                    <input type="text" id="catNombre" required>
                </div>
                <div class="form-group">
                    <label>Descripción:</label>
                    <input type="text" id="catDescripcion" required>
                </div>
                <button type="submit">Guardar Categoría</button>
            </form>
        </div>
        <div>
            <h2>Lista de Categorías</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acción</th></tr>
                </thead>
                <tbody id="categoriasTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN DE PRODUCTOS -->
    <div class="grid-container">
        <div class="card">
            <h2>Nuevo Producto</h2>
            <form id="productForm">
                <div class="form-group"><label>Nombre:</label><input type="text" id="nombre" required></div>
                <div class="form-group"><label>Precio:</label><input type="text" id="precio" required></div>
                <div class="form-group"><label>Código:</label><input type="text" id="codigo" required></div>
                <div class="form-group"><label>Descripción:</label><input type="text" id="descripcion" required></div>
                <div class="form-group"><label>Talla:</label><input type="text" id="talla" required></div>
                <div class="form-group"><label>Género:</label><input type="text" id="genero" required></div>
                <div class="form-group"><label>Color:</label><input type="text" id="color" required></div>
                <button type="submit">Guardar Producto</button>
            </form>
        </div>
        <div>
            <h2>Lista de Productos</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Talla</th>
                        <th>Género</th>
                        <th>Color</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="productosTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_PROD = '/api/Productos';
        const API_CAT = '/api/Categorias';

        // ---- LÓGICA DE CATEGORÍAS ----
        async function loadCategorias() {
            const res = await fetch(API_CAT);
            const data = await res.json();
            const tbody = document.getElementById('categoriasTableBody');
            tbody.innerHTML = '';
            data.forEach(c => {
                tbody.innerHTML += `<tr>
                        <td>${c.id}</td><td>${c.nombre}</td><td>${c.descripcion}</td>
                        <td><button class="btn-danger" onclick="deleteItem('${API_CAT}', ${c.id})">Eliminar</button></td>
                    </tr>`;
            });
        }

        document.getElementById('categoriaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevaCat = {
                nombre: document.getElementById('catNombre').value,
                descripcion: document.getElementById('catDescripcion').value
            };
            await fetch(API_CAT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(nuevaCat) });
            document.getElementById('categoriaForm').reset();
            loadCategorias();
        });

        // ---- LÓGICA DE PRODUCTOS ----
        async function loadProductos() {
            const res = await fetch(API_PROD);
            const data = await res.json();
            const tbody = document.getElementById('productosTableBody');
            tbody.innerHTML = '';
            data.forEach(p => {
                tbody.innerHTML += `<tr>
                        <td>${p.id}</td><td>${p.nombre}</td><td>$${p.precio}</td><td>${p.codigo}</td>
                        <td>${p.descripcion}</td><td>${p.talla}</td><td>${p.genero}</td><td>${p.color}</td>
                        <td><button class="btn-danger" onclick="deleteItem('${API_PROD}', ${p.id})">Eliminar</button></td>
                    </tr>`;
            });
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevoProd = {
                nombre: document.getElementById('nombre').value, precio: document.getElementById('precio').value,
                codigo: document.getElementById('codigo').value, descripcion: document.getElementById('descripcion').value,
                talla: document.getElementById('talla').value, genero: document.getElementById('genero').value,
                color: document.getElementById('color').value
            };
            await fetch(API_PROD, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(nuevoProd) });
            document.getElementById('productForm').reset();
            loadProductos();
        });

        // ---- LÓGICA GLOBAL (ELIMINAR) ----
        async function deleteItem(api, id) {
            if (confirm("¿Seguro que deseas eliminar este registro?")) {
                await fetch(`${api}/${id}`, { method: 'DELETE' });
                if (api === API_PROD) loadProductos();
                else loadCategorias();
            }
        }

        // Cargar datos iniciales
        loadCategorias();
        loadProductos();
    </script>
</body>
</html>
